name: oidc-pivot

# Runs on main (succeeds) and on pull requests (denied by the pinned trust policy).
# The PR failure at the credentials step is the intended lesson: proper sub scoping
# stops a poisoned pre-merge run from reaching AWS.

on:
  push:
    branches: [main]
  pull_request:

# id-token: write is required to request an OIDC token. GitHub refuses to grant it
# to workflows from forked pull requests, which is the first line of defense.
permissions:
  id-token: write
  contents: read

jobs:
  pivot:
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Account id is visible here, which is fine. It is not a secret, and the
          # trust policy is pinned to this repo's main branch, so it is not usable
          # by anyone else.
          role-to-assume: arn:aws:iam::768242378223:role/github-cicd-lab
          aws-region: us-east-1

      - name: Read the sandbox trophy
        run: |
          echo "Assumed the lab role via OIDC. Reading the sandbox secret:"
          aws ssm get-parameter --name /workshop/prod-admin-creds --query 'Parameter.Value' --output text
